name: Dashboard checks

"on":
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_PROJECT_ID: example
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: public-placeholder
      SUPABASE_PROJECT_ID: example
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Remove tracked environment file before installing dependencies
        run: rm -f .env
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
